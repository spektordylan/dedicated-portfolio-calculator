[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dedicated-portfolio-calculator"
version = "0.1.0"
description = "Minimum-cost dedicated Treasury portfolio calculator"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
portfolio-calculator = "dedicated_portfolio.main:main"